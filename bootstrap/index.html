<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <style>
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
  </style>
  <body>
    <div class="container">
      <div class="row">
        <div
          class="col-12 g-0 d-flex justify-content-center align-itens-center"
        >
          <form style="width: 340px">
            <h1 style="text-align: center">Cadastro</h1>
            <label class="form-label" for="nome">Seu nome</label>
            <input class="form-control" type="text" name="nome" />
            <label class="form-label" for="telefone">Seu telefone</label>
            <input class="form-control" type="tel" id="telefone" />
            <label class="form-label" for="email">Seu e-mail</label>
            <input class="form-control" type="email" id="email" />
            <label class="form-label" for="password">Sua senha</label>
            <input
              style="margin-bottom: 8px"
              class="form-control"
              type="password"
              id="password"
            />
            <button style="width: 100%" class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
